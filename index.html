<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Similarity & Clustering</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <div id=" app" class="min-h-screen bg-background text-foreground transition-colors">
    <header
      class="border-b border-border bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60 sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center py-6">
          <h1 class="text-3xl font-bold text-foreground">Image Similarity & Clustering</h1>

          <div class="flex items-center space-x-4">
            <!-- Tabs -->
            <div class="flex space-x-1 bg-muted p-1 rounded-lg">
              <button id="search-tab"
                class="px-4 py-2 rounded-md text-sm font-medium transition-colors bg-background text-foreground shadow-sm">
                Search
              </button>
              <button id="cluster-tab"
                class="px-4 py-2 rounded-md text-sm font-medium transition-colors text-muted-foreground hover:text-foreground hover:bg-background/50">
                Cluster
              </button>
            </div>

            <!-- Theme Toggle -->
            <button id="theme-toggle" class="theme-toggle p-2 rounded-md hover:bg-accent transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="h-5 w-5 theme-toggle-icon">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Notification Container -->
    <div id="notification-container" class="fixed top-4 left-0 right-0 z-50 flex justify-center pointer-events-none">
    </div>

    <!-- Main -->
    <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
      <div class="space-y-8">

        <!-- Search Section -->
        <div id="search-section" class="w-full max-w-4xl mx-auto space-y-6">

          <!-- Upload Folder -->
          <div class="bg-card border-border rounded-lg border shadow-sm">
            <div class="p-6 pb-3">
              <h2 class="flex items-center gap-2 text-card-foreground font-semibold text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
                  <path d="M2 11v8a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-8M2 7v4m20-4v4" />
                  <path d="M4.93 2.93a2 2 0 0 1 2.83 0l1.41 1.41A2 2 0 0 1 10 5.83V7a1 1 0 0 0 1 1h8a2 2 0 0 1 2 2" />
                </svg>
                Upload Image Folder
              </h2>
            </div>
            <div class="p-6 pt-3 space-y-4">
              <div class="flex gap-3">
                <input type="file" id="folder-input" webkitdirectory directory multiple accept="image/*" class="hidden">

                <button id="select-folder-btn"
                  class="w-full flex items-center justify-center gap-2 bg-primary text-primary-foreground px-4 py-2 rounded-md hover:bg-primary/90 transition-colors">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="h-4 w-4">
                    <path d="M2 11v8a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-8M2 7v4m20-4v4" />
                    <path d="M4.93 2.93a2 2 0 0 1 2.83 0l1.41 1.41A2 2 0 0 1 10 5.83V7a1 1 0 0 0 1 1h8a2 2 0 0 1 2 2" />
                  </svg>
                  Select Image Folder
                </button>

                <button id="upload-folder-btn" disabled
                  class="w-full flex items-center justify-center gap-2 bg-primary text-primary-foreground px-4 py-2 rounded-md hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="h-4 w-4">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                  </svg>
                  Upload Folder
                </button>
              </div>

              <div id="folder-info" class="hidden flex items-center gap-3 p-3 bg-muted rounded-md">
                <p id="folder-name" class="text-sm font-medium text-foreground"></p>
                <p id="file-count" class="text-sm font-medium text-muted-foreground"></p>
              </div>
            </div>
          </div>

          <!-- Search Parameters -->
          <div class="bg-card border-border rounded-lg border shadow-sm">
            <div class="p-6 pb-3">
              <h2 class="flex items-center gap-2 text-card-foreground font-semibold text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
                  <line x1="21" y1="4" x2="14" y2="4" />
                  <line x1="10" y1="4" x2="3" y2="4" />
                  <line x1="21" y1="12" x2="12" y2="12" />
                  <line x1="8" y1="12" x2="3" y2="12" />
                  <line x1="21" y1="20" x2="16" y2="20" />
                  <line x1="12" y1="20" x2="3" y2="20" />
                  <circle cx="12" cy="4" r="2" />
                  <circle cx="10" cy="12" r="2" />
                  <circle cx="14" cy="20" r="2" />
                </svg>
                Search Parameters
              </h2>
            </div>
            <div class="p-6 pt-3">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium mb-1 text-foreground">Number of Results</label>
                  <input id="top-k-input" type="number" min="1" max="50" value="5"
                    class="bg-background border-input text-foreground w-full px-3 py-2 rounded-md border focus:outline-none focus:ring-2 focus:ring-ring">
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1 text-foreground">Similarity Threshold</label>
                  <input id="threshold-input" type="number" step="0.01" min="0" max="1" value="0.12"
                    class="bg-background border-input text-foreground w-full px-3 py-2 rounded-md border focus:outline-none focus:ring-2 focus:ring-ring">
                </div>
              </div>
            </div>
          </div>

          <!-- Text Search -->
          <div class="bg-card border-border rounded-lg border shadow-sm">
            <div class="p-6 pb-3">
              <h2 class="flex items-center gap-2 text-card-foreground font-semibold text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
                  <polyline points="4 7 4 4 20 4 20 7" />
                  <line x1="9" y1="20" x2="15" y2="20" />
                  <line x1="12" y1="4" x2="12" y2="20" />
                </svg>
                Search by Text
              </h2>
            </div>
            <div class="p-6 pt-3">
              <div class="flex flex-col gap-3">
                <input id="text-query-input" type="text" placeholder="Describe what you're looking for..."
                  class="bg-background border-input text-foreground placeholder:text-muted-foreground px-3 py-2 rounded-md border focus:outline-none focus:ring-2 focus:ring-ring">

                <button id="text-search-btn"
                  class="flex items-center gap-2 justify-center bg-primary text-primary-foreground px-4 py-2 rounded-md hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="h-4 w-4">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                  </svg>
                  Search
                </button>
              </div>
            </div>
          </div>

          <!-- Image Search -->
          <div class="bg-card border-border rounded-lg border shadow-sm">
            <div class="p-6 pb-3">
              <h2 class="flex items-center gap-2 text-card-foreground font-semibold text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7" />
                  <line x1="16" y1="5" x2="22" y2="5" />
                  <line x1="19" y1="2" x2="19" y2="8" />
                  <circle cx="9" cy="9" r="2" />
                  <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                </svg>
                Search by Image
              </h2>
            </div>
            <div class="p-6 pt-3 space-y-3 flex flex-col gap-2">
              <input id="image-upload-input" type="file" accept="image/*"
                class="text-sm text-muted-foreground file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-muted file:text-foreground hover:file:bg-muted/80 transition-colors">

              <div id="image-preview-container" class="relative inline-block w-32 h-32 hidden">
                <img id="image-preview" src="" alt="Preview"
                  class="w-full h-full object-cover rounded-md border border-border">
                <button id="remove-image-btn"
                  class="absolute -top-2 -right-2 h-6 w-6 p-0 rounded-full bg-destructive text-destructive-foreground hover:bg-destructive/90 flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="h-3 w-3">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                  </svg>
                </button>
              </div>

              <button id="image-search-btn" disabled
                class="w-full flex items-center justify-center gap-2 bg-primary text-primary-foreground px-4 py-2 rounded-md hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.35-4.35" />
                </svg>
                Search
              </button>
            </div>
          </div>

        </div>

        <!-- Clustering Section -->
        <div id="clustering-section" class="hidden w-full max-w-4xl mx-auto">
          <div class="bg-card border-border rounded-lg border shadow-sm">
            <div class="p-6 pb-3">
              <h2 class="flex items-center gap-2 text-card-foreground font-semibold text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6">
                  <path
                    d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" />
                  <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" />
                  <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" />
                </svg>
                Image Clustering
              </h2>
            </div>
            <div class="p-6 pt-3 space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-medium mb-1 text-foreground">Max Number of Clusters</label>
                  <input id="max-clusters-input" type="number" min="1" placeholder="e.g., 10"
                    class="bg-background border-input text-foreground placeholder:text-muted-foreground w-full px-3 py-2 rounded-md border focus:outline-none focus:ring-2 focus:ring-ring">
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1 text-foreground">Similarity Threshold</label>
                  <input id="cluster-threshold-input" type="number" step="0.01" min="0" max="1" placeholder="e.g., 0.7"
                    class="bg-background border-input text-foreground placeholder:text-muted-foreground w-full px-3 py-2 rounded-md border focus:outline-none focus:ring-2 focus:ring-ring">
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1 text-foreground">Min Images per Cluster</label>
                  <input id="min-images-input" type="number" min="1" placeholder="e.g., 2"
                    class="bg-background border-input text-foreground placeholder:text-muted-foreground w-full px-3 py-2 rounded-md border focus:outline-none focus:ring-2 focus:ring-ring">
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1 text-foreground">Max Images per Cluster</label>
                  <input id="max-images-input" type="number" min="1" placeholder="e.g., 20"
                    class="bg-background border-input text-foreground placeholder:text-muted-foreground w-full px-3 py-2 rounded-md border focus:outline-none focus:ring-2 focus:ring-ring">
                </div>
              </div>

              <div class="text-xs text-muted-foreground space-y-1">
                <p>• Leave fields empty to use default clustering behavior</p>
                <p>• Use either "Max Clusters" OR "Similarity Threshold", not both</p>
                <p>• Min/Max images per cluster are optional filters</p>
              </div>

              <button id="cluster-btn"
                class="w-full flex items-center justify-center gap-2 bg-primary text-primary-foreground px-4 py-2 rounded-md hover:bg-primary/90 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                  <path
                    d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" />
                  <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" />
                  <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" />
                </svg>
                Cluster
              </button>
            </div>
          </div>
        </div>

        <!-- Results -->
        <div id="results-container" class="hidden border-t border-border pt-8">
        </div>

      </div>
    </main>
  </div>
</body>

</html>
